[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperlens"
version = "0.1.0"
description = "Evidence-grounded academic interpretation and audit workspace"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "openai>=1,<3",
    "pdfplumber>=0.11,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.20,<1",
    "rank-bm25>=0.2,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
desktop = [
    "pywebview==6.2.1; sys_platform == 'win32'",
]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "eval"]
addopts = "-ra"
